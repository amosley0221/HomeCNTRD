services:
  - type: web
    name: homecntrd
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Set these in the Render dashboard (Service → Environment) — they're
      # read at build time and inlined into the bundle. The anon key is
      # safe to ship; access control is enforced by Supabase RLS.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # The service worker must be served with no caching so updates roll
      # out promptly.
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /registerSW.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Hashed bundle assets are immutable.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback — let the client router (and the offline service worker)
      # handle deep links.
      - type: rewrite
        source: /*
        destination: /index.html
